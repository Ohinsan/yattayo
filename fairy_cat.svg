<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" shape-rendering="crispEdges">
  <rect width="100" height="100" fill="#0c121e" />
  <!-- Bubbles in background -->
  <circle cx="20" cy="25" r="8" fill="#38bdf8" opacity="0.4" />
  <circle cx="82" cy="30" r="10" fill="#38bdf8" opacity="0.4" />
  <circle cx="15" cy="70" r="6" fill="#38bdf8" opacity="0.3" />
  <circle cx="85" cy="75" r="7" fill="#38bdf8" opacity="0.3" />
  <circle cx="50" cy="15" r="5" fill="#bae6fd" opacity="0.5" />
  <!-- Cat Body (Soap Bubble Foam) -->
  <path d="M 30,55 Q 25,85 50,85 Q 75,85 70,55 Z" fill="#e0f2fe" />
  <path d="M 34,58 Q 30,80 50,80 Q 70,80 66,58 Z" fill="#ffffff" />
  <!-- Ears -->
  <polygon points="32,45 22,25 42,35" fill="#e0f2fe" />
  <polygon points="32,43 25,28 39,36" fill="#f472b6" />
  <polygon points="68,45 78,25 58,35" fill="#e0f2fe" />
  <polygon points="68,43 75,28 61,36" fill="#f472b6" />
  <!-- Head -->
  <ellipse cx="50" cy="46" rx="22" ry="17" fill="#ffffff" stroke="#bae6fd" stroke-width="2" />
  <!-- Eyes -->
  <ellipse cx="42" cy="45" rx="3.5" ry="4.5" fill="#0284c7" />
  <circle cx="43" cy="43.5" r="1.5" fill="#ffffff" />
  <ellipse cx="58" cy="45" rx="3.5" ry="4.5" fill="#0284c7" />
  <circle cx="59" cy="43.5" r="1.5" fill="#ffffff" />
  <!-- Nose & Mouth -->
  <polygon points="49,50 51,50 50,52" fill="#f472b6" />
  <path d="M 46,53 Q 50,56 54,53" fill="none" stroke="#0369a1" stroke-width="1.5" stroke-linecap="round" />
  <!-- Cheeks -->
  <circle cx="36" cy="51" r="3" fill="#fbcfe8" opacity="0.6" />
  <circle cx="64" cy="51" r="3" fill="#fbcfe8" opacity="0.6" />
  <!-- Paws -->
  <ellipse cx="40" cy="78" rx="6" ry="4" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5" />
  <ellipse cx="60" cy="78" rx="6" ry="4" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5" />
  <!-- Tiny Rubber Ducky on head -->
  <ellipse cx="50" cy="28" rx="6" ry="5" fill="#facc15" />
  <circle cx="48" cy="27" r="1" fill="#000" />
  <polygon points="44,28 41,29 44,30" fill="#f97316" />
  <!-- Tail -->
  <path d="M 68,75 Q 85,75 82,60 Q 80,50 88,48" fill="none" stroke="#e0f2fe" stroke-width="6" stroke-linecap="round" />
</svg>
