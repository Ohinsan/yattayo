<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" shape-rendering="crispEdges">
  <!-- Wind Swirls -->
  <path d="M 15,25 Q 35,15 50,22 Q 65,30 85,20" fill="none" stroke="#86efac" stroke-width="1.5" opacity="0.4" />
  <path d="M 10,75 Q 30,85 55,78 Q 75,70 90,82" fill="none" stroke="#86efac" stroke-width="1.5" opacity="0.4" />
  <!-- Leaves floating -->
  <circle cx="20" cy="40" r="3" fill="#4ade80" opacity="0.7" />
  <circle cx="80" cy="65" r="4" fill="#4ade80" opacity="0.7" />
  <!-- Little Broom Boy Body -->
  <rect x="38" y="52" width="24" height="28" rx="4" fill="#15803d" />
  <!-- White apron/belt -->
  <rect x="38" y="62" width="24" height="6" fill="#fef08a" />
  <!-- Head with bandana -->
  <circle cx="50" cy="40" rx="16" ry="14" fill="#fbcfe8" />
  <!-- Indigo craftman headband -->
  <rect x="34" y="32" width="32" height="6" fill="#1e3a8a" />
  <circle cx="50" cy="31" r="3" fill="#ffffff" />
  <!-- Eyes -->
  <circle cx="44" cy="41" r="2.5" fill="#1e293b" />
  <circle cx="56" cy="41" r="2.5" fill="#1e293b" />
  <circle cx="45" cy="40" r="0.8" fill="#ffffff" />
  <circle cx="57" cy="40" r="0.8" fill="#ffffff" />
  <!-- Cheeks -->
  <circle cx="40" cy="44" r="2.5" fill="#f43f5e" opacity="0.6" />
  <circle cx="60" cy="44" r="2.5" fill="#f43f5e" opacity="0.6" />
  <!-- Smiling mouth -->
  <path d="M 47,46 Q 50,49 53,46" fill="none" stroke="#b91c1c" stroke-width="1.5" stroke-linecap="round" />
  <!-- Straw Broom (Right Hand) -->
  <!-- Broom Stick -->
  <line x1="68" y1="20" x2="68" y2="82" stroke="#b45309" stroke-width="3" stroke-linecap="round" />
  <!-- Broom Bristles -->
  <polygon points="62,70 74,70 78,88 58,88" fill="#fde047" stroke="#ca8a04" stroke-width="1" />
  <!-- Broom binding band -->
  <rect x="62" y="72" width="12" height="3" fill="#dc2626" />
  <!-- Dustpan (Left Hand) -->
  <rect x="22" y="65" width="14" height="12" fill="#3b82f6" rx="2" />
  <line x1="28" y1="58" x2="28" y2="65" stroke="#1d4ed8" stroke-width="2" />
  <!-- Sparkles -->
  <polygon points="26,30 28,26 30,30 34,32 30,34 28,38 26,34 22,32" fill="#fef08a" />
  <polygon points="76,45 77,42 79,45 82,46 79,47 77,50 76,47 73,46" fill="#fef08a" />
</svg>
