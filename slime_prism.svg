<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" shape-rendering="crispEdges">
  <rect width="100" height="100" fill="#0d1527" />
  <!-- Rainbow Light Rings -->
  <circle cx="50" cy="55" r="40" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.4" />
  <circle cx="50" cy="55" r="35" fill="none" stroke="#ec4899" stroke-width="1" stroke-dasharray="4,4" opacity="0.3" />
  <!-- Slime Jelly Body -->
  <path d="M 50,30 Q 75,30 82,58 Q 85,82 50,85 Q 15,82 18,58 Q 25,30 50,30 Z" fill="#06b6d4" opacity="0.85" />
  <path d="M 50,34 Q 70,34 76,56 Q 78,78 50,81 Q 22,78 24,56 Q 30,34 50,34 Z" fill="#67e8f9" opacity="0.6" />
  <!-- Inner Rainbow Gem Core (Prism Diamond) -->
  <polygon points="50,48 64,58 50,74 36,58" fill="#f43f5e" opacity="0.85" />
  <polygon points="50,48 50,74 64,58" fill="#a855f7" opacity="0.75" />
  <polygon points="50,48 50,74 36,58" fill="#3b82f6" opacity="0.75" />
  <polygon points="50,48 57,53 50,58 43,53" fill="#ffffff" opacity="0.9" />
  <!-- Slime Eyes -->
  <ellipse cx="40" cy="48" rx="3.5" ry="5.5" fill="#0f172a" />
  <ellipse cx="60" cy="48" rx="3.5" ry="5.5" fill="#0f172a" />
  <circle cx="41.5" cy="46" r="1.5" fill="#ffffff" />
  <circle cx="61.5" cy="46" r="1.5" fill="#ffffff" />
  <!-- Cheerful Smile -->
  <path d="M 46,55 Q 50,59 54,55" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />
  <!-- Royal Golden Crown on Top -->
  <polygon points="34,30 38,15 44,24 50,12 56,24 62,15 66,30" fill="#facc15" stroke="#ca8a04" stroke-width="1.5" />
  <rect x="34" y="27" width="32" height="4" fill="#eab308" />
  <circle cx="50" cy="18" r="2" fill="#ef4444" />
  <circle cx="41" cy="22" r="1.5" fill="#3b82f6" />
  <circle cx="59" cy="22" r="1.5" fill="#10b981" />
  <!-- Sparkles -->
  <polygon points="22,35 24,31 26,35 30,37 26,39 24,43 22,39 18,37" fill="#fef08a" />
  <polygon points="78,35 80,31 82,35 86,37 82,39 80,43 78,39 74,37" fill="#fef08a" />
</svg>
